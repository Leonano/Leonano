<svg xmlns="http://www.w3.org/2000/svg" width="880" height="362" viewBox="0 0 880 362" role="img" aria-labelledby="t d">
  <title id="t">Where my tool-building time goes, before and with AI</title>
  <desc id="d">Before AI: 30% vision, 50% figuring out how, 20% building, and only 5% of the vision ever shipped; most ideas died in the how. With AI: 30% human vision, 70% AI. Same human vision, it just stops dying in the how. AI doesn't replace the craft. It closes the gap between an idea and the artist using it.</desc>
  <style>
    :root { --ink: #1f2328; --muted: #59636e; --rule: #d1d9e0; --track: #e6eaef;
            --human: #d98a1f; --how: #8c959f; --impl: #8250df; --ai: #3f7fd0; }
    @media (prefers-color-scheme: dark) {
      :root { --ink: #e6edf3; --muted: #9198a1; --rule: #3d444d; --track: #262c36;
              --human: #e8a33d; --how: #6e7681; --impl: #a371f7; --ai: #5b9be6; }
    }
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; fill: var(--ink); }
    .head { font-size: 13px; font-weight: 700; fill: var(--muted); letter-spacing: .12em; }
    .sub { font-size: 13px; font-weight: 400; fill: var(--muted); letter-spacing: 0; }
    .pct { font-size: 26px; font-weight: 600; }
    .pct-s { font-size: 20px; font-weight: 600; }
    .who { font-size: 14px; font-weight: 600; fill: var(--muted); letter-spacing: .04em; }
    .out { font-size: 15px; font-weight: 600; }
    .quote { font-size: 17px; font-weight: 600; font-style: italic; }
    .human { fill: var(--human); } .how { fill: var(--how); } .impl { fill: var(--impl); } .ai { fill: var(--ai); }
    .track { fill: var(--track); }
  </style>

  <!-- BEFORE AI -->
  <text class="head" x="0" y="16">BEFORE AI <tspan class="sub">· where my tool time went</tspan></text>
  <text class="pct" x="0" y="52">30%</text><text class="who" x="58" y="51">VISION</text>
  <text class="pct" x="266" y="52">50%</text><text class="who" x="324" y="51">FIGURING OUT HOW</text>
  <text class="pct" x="706" y="52">20%</text><text class="who" x="764" y="51">BUILDING</text>
  <rect class="human" x="0" y="64" width="263" height="24" rx="4"/>
  <rect class="how" x="265" y="64" width="439" height="24" rx="4"/>
  <rect class="impl" x="706" y="64" width="174" height="24" rx="4"/>

  <!-- how much of the vision actually shipped -->
  <text class="pct-s" x="0" y="124">5%</text><text class="who" x="34" y="123">OF THE VISION SHIPPED</text>
  <rect class="track" x="0" y="132" width="880" height="10" rx="5"/>
  <rect class="human" x="0" y="132" width="44" height="10" rx="5"/>
  <text class="out" x="0" y="172">→ most ideas died in the “how”.</text>

  <line x1="0" y1="198" x2="880" y2="198" stroke="var(--rule)" stroke-width="1"/>

  <!-- WITH AI -->
  <text class="head" x="0" y="230">WITH AI <tspan class="sub">· where it goes now</tspan></text>
  <text class="pct" x="0" y="266">30%</text><text class="who" x="58" y="265">HUMAN VISION</text>
  <text class="pct" x="266" y="266">70%</text><text class="who" x="324" y="265">AI</text>
  <rect class="human" x="0" y="278" width="263" height="24" rx="4"/>
  <rect class="ai" x="265" y="278" width="615" height="24" rx="4"/>

  <text class="out" x="0" y="326">→ same 30% of human vision. It just stops dying in the “how”.</text>
  <text class="quote" x="0" y="352">AI doesn't replace the craft. It closes the gap between an idea and the artist using it.</text>
</svg>
